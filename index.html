<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Letterboxd Diary</title>
    <style>
        :root {
            --bg-color: #14181c;
            --card-bg: #1b2228;
            --text-color: #9ab;
            --accent-color: #00e054;
            --input-bg: #2c3440;
            --border-color: #456;
            --white: #fff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: var(--white); font-weight: 300; margin-bottom: 20px; }

        .filter-container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            width: 100%;
            max-width: 800px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
        }

        .filter-group { display: flex; flex-direction: column; }
        label { font-size: 0.8rem; margin-bottom: 5px; color: var(--white); }

        input, select {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--white);
            padding: 8px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .sort-container {
            width: 100%;
            max-width: 800px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: flex-end;
        }

        #movie-list {
            width: 100%;
            max-width: 800px;
            display: grid;
            gap: 10px;
        }

        .movie-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid var(--accent-color);
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 15px;
            transition: transform 0.1s;
        }

        .movie-card:hover { transform: scale(1.01); }
        .movie-name { color: var(--white); font-weight: bold; font-size: 1.1rem; }
        .movie-details { font-size: 0.85rem; }
        .movie-rating { color: var(--accent-color); font-weight: bold; }

        @media (max-width: 600px) {
            .movie-card { grid-template-columns: 1fr; gap: 5px; }
        }
    </style>
</head>
<body>

    <h1>🎬 Movie Diary</h1>

    <div class="filter-container">
        <div class="filter-group">
            <label>Name</label>
            <input type="text" id="filter-name" placeholder="Film suchen..." oninput="applyFilters()">
        </div>
        <div class="filter-group">
            <label>Jahr</label>
            <input type="text" id="filter-year" placeholder="z.B. 1984" oninput="applyFilters()">
        </div>
        <div class="filter-group">
            <label>Rating (Min)</label>
            <input type="number" id="filter-rating" step="0.5" placeholder="0.0" oninput="applyFilters()">
        </div>
        <div class="filter-group">
            <label>Tags</label>
            <input type="text" id="filter-tags" placeholder="z.B. heimkino" oninput="applyFilters()">
        </div>
        <div class="filter-group">
            <label>Date (von)</label>
            <input type="date" id="filter-date" onchange="applyFilters()">
        </div>
        <div class="filter-group">
            <label>Watched Date (von)</label>
            <input type="date" id="filter-watched" onchange="applyFilters()">
        </div>
    </div>

    <div class="sort-container">
        <label>Sortieren nach:</label>
        <select id="sort-by" onchange="applyFilters()">
            <option value="Date-desc">Datum (Neueste zuerst)</option>
            <option value="Date-asc">Datum (Älteste zuerst)</option>
            <option value="Rating-desc">Rating (Höchste zuerst)</option>
            <option value="Year-desc">Jahr (Neueste zuerst)</option>
            <option value="Name-asc">Name (A-Z)</option>
        </select>
    </div>

    <div id="movie-list">Lade Filme...</div>

    <script>
        let movies = [];

        // Diese Funktion liest CSV-Dateien korrekt aus, auch wenn Kommas in Anführungszeichen stehen
        function parseCSVLine(text) {
            const result = [];
            let curVal = "";
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(curVal.trim());
                    curVal = "";
                } else {
                    curVal += char;
                }
            }
            result.push(curVal.trim());
            return result;
        }

        async function loadCSV() {
            try {
                const response = await fetch('diary.csv');
                const data = await response.text();
                const lines = data.split(/\r?\n/).filter(l => l.trim() !== '');
                
                if (lines.length === 0) throw new Error("CSV ist leer");

                const header = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, '').toLowerCase());
                
                const colIdx = {
                    date: header.indexOf('date'),
                    name: header.indexOf('name'),
                    year: header.indexOf('year'),
                    rating: header.indexOf('rating'),
                    tags: header.indexOf('tags'),
                    watched: header.indexOf('watched date')
                };
                if (colIdx.watched === -1) colIdx.watched = header.indexOf('watched');

                const rows = lines.slice(1);

                movies = rows.map(row => {
                    const cols = parseCSVLine(row);
                    return {
                        date: colIdx.date !== -1 ? cols[colIdx.date] || '' : '',
                        name: colIdx.name !== -1 ? cols[colIdx.name] || '' : '',
                        year: colIdx.year !== -1 ? cols[colIdx.year] || '' : '',
                        rating: colIdx.rating !== -1 ? parseFloat(cols[colIdx.rating].replace(',', '.')) || 0 : 0,
                        tags: colIdx.tags !== -1 ? cols[colIdx.tags] || '' : '',
                        watchedDate: colIdx.watched !== -1 ? cols[colIdx.watched] || '' : ''
                    };
                });
                
                applyFilters();
            } catch (e) {
                document.getElementById('movie-list').innerHTML = "Fehler beim Laden der Datei: " + e.message;
            }
        }

        function applyFilters() {
            const fName = document.getElementById('filter-name').value.toLowerCase().trim();
            const fYear = document.getElementById('filter-year').value.trim();
            const fRating = document.getElementById('filter-rating').value;
            const fTags = document.getElementById('filter-tags').value.toLowerCase().trim();
            const fDate = document.getElementById('filter-date').value;
            const fWatched = document.getElementById('filter-watched').value;
            const sortVal = document.getElementById('sort-by').value;

            let filtered = movies.filter(m => {
                const matchesName = !fName || m.name.toLowerCase().includes(fName);
                const matchesYear = !fYear || m.year === fYear;
                const matchesRating = fRating === "" || m.rating >= parseFloat(fRating);
                const matchesTags = !fTags || m.tags.toLowerCase().includes(fTags);
                const matchesDate = !fDate || m.date >= fDate;
                const matchesWatched = !fWatched || m.watchedDate >= fWatched;

                return matchesName && matchesYear && matchesRating && matchesTags && matchesDate && matchesWatched;
            });

            const [key, dir] = sortVal.split('-');
            filtered.sort((a, b) => {
                let valA = a[key.toLowerCase() === 'date' ? 'date' : key.toLowerCase()];
                let valB = b[key.toLowerCase() === 'date' ? 'date' : key.toLowerCase()];
                if (dir === 'asc') return valA > valB ? 1 : -1;
                return valA < valB ? 1 : -1;
            });

            renderList(filtered);
        }

        function renderList(list) {
            const container = document.getElementById('movie-list');
            if (list.length === 0) {
                container.innerHTML = "Keine Filme gefunden.";
                return;
            }

            container.innerHTML = list.map(m => `
                <div class="movie-card">
                    <div style="flex:1">
                        <div class="movie-name">${m.name} (${m.year})</div>
                        <div class="movie-details">📅 ${m.date} | 🏷️ ${m.tags} | 🕒 Watched: ${m.watchedDate}</div>
                    </div>
                    <div class="movie-rating">${m.rating ? m.rating + ' ★' : 'Kein Rating'}</div>
                </div>
            `).join('');
        }

        loadCSV();
    </script>
</body>
</html>
